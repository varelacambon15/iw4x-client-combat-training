// Combat Training: run by ct_start before every session (CombatTraining.cpp)

// The rules of the online playlists
exec default_xboxlive.cfg

// Bot Warfare
set bots_main 1
set bots_main_menu 0
set bots_main_firstIsHost 1
set bots_main_waitForHostTime 3
set bots_main_kickBotsAtEnd 0
set bots_main_chat 1
set bots_manage_fill_mode 0
set bots_manage_fill_kick 1
set bots_manage_fill_spec 1
set bots_team autoassign
set bots_team_force 1
set bots_skill 0
set bots_loadout_reasonable 1
set bots_loadout_allow_op 1
set bots_loadout_rank -1
set bots_loadout_prestige -2
set bots_play_killstreak 1
set bots_play_take_carepackages 1

// Your own settings for Combat Training go in combat_training/user.cfg (kept across updates of the mod)
exec combat_training/user.cfg
